name: Refresh crowd snapshot

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/refresh-crowd.yml'
      - 'scripts/update-crowd.mjs'
      - 'scripts/refine-crowd.mjs'
  schedule:
    # GitHub Actions minimum interval is 5 minutes. Shift away from minute 0 to reduce queue delays.
    - cron: '2-57/5 * * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write

concurrency:
  group: crowd-snapshot-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Refresh crowd snapshot
        run: node scripts/update-crowd.mjs

      - name: Refine crowd semantics and probe public waits
        run: node scripts/refine-crowd.mjs

      - name: Publish latest snapshot to crowd-live branch
        shell: bash
        run: |
          cp app/data/crowd.json /tmp/crowd.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/crowd.json app/data/crowd.json
          git add app/data/crowd.json
          git commit -m "Latest crowd snapshot"
          git push --force origin HEAD:crowd-live
