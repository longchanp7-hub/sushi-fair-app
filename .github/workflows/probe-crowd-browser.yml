name: Probe browser crowd sources

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/probe-crowd-browser.mjs'
      - '.github/workflows/probe-crowd-browser.yml'

permissions:
  contents: write

concurrency:
  group: browser-crowd-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser driver only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Locate preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "Preinstalled Chrome was not found" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Inspect public official pages in a real browser
        run: node scripts/probe-crowd-browser.mjs
      - name: Save diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f diagnostics/crowd-browser.json ]]; then
            echo "Diagnostic report was not created" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/crowd-browser.json
          git commit -m "Add browser crowd diagnostic report"
          git push origin HEAD:main
