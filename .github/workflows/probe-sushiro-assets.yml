name: Probe Sushiro public assets

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/probe-sushiro-assets.mjs'
      - '.github/workflows/probe-sushiro-assets.yml'

permissions:
  contents: write

concurrency:
  group: sushiro-public-asset-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect public Sushiro HTML and JavaScript
        run: node scripts/probe-sushiro-assets.mjs
      - name: Save diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/sushiro-assets.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/sushiro-assets.json
          git commit -m "Add Sushiro asset diagnostic report"
          git push origin HEAD:main
