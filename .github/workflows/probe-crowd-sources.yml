name: Probe crowd sources

on:
  workflow_dispatch:
  push:
    branches: ['agent/crowd-source-probe']
    paths:
      - 'scripts/probe-crowd-sources.mjs'
      - '.github/workflows/probe-crowd-sources.yml'

permissions:
  contents: write

concurrency:
  group: crowd-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crowd-source-probe
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect public official pages and assets
        run: node scripts/probe-crowd-sources.mjs
      - name: Save diagnostic report to this branch
        shell: bash
        run: |
          if git diff --quiet -- diagnostics/crowd-sources.json; then
            echo "No diagnostic changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/crowd-sources.json
          git commit -m "Add crowd source diagnostic report"
          git push origin HEAD:agent/crowd-source-probe
