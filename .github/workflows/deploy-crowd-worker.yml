name: Deploy live crowd API

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
      - 'scripts/set-crowd-api-url.mjs'
      - '.github/workflows/deploy-crowd-worker.yml'

permissions:
  contents: write

concurrency:
  group: deploy-live-crowd-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; deployment is skipped."
          fi

      - name: Deploy Worker
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
          command: deploy

      - name: Verify live crowd API
        if: steps.credentials.outputs.ready == 'true' && steps.deploy.outcome == 'success'
        id: verify
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          if [[ -z "$WORKER_URL" ]]; then
            echo "Worker deployment URL was not returned."
            exit 1
          fi

          for attempt in {1..10}; do
            if curl --fail --silent --show-error "$WORKER_URL/health" > /tmp/crowd-health.json; then
              break
            fi
            if [[ "$attempt" == "10" ]]; then
              echo "Worker health check failed after 10 attempts."
              exit 1
            fi
            sleep 3
          done

          curl --fail --silent --show-error "$WORKER_URL/crowd" > /tmp/crowd-live.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/crowd-live.json','utf8'));if(!Array.isArray(d.stores)||d.stores.length!==4)throw new Error('Crowd API must return four stores');console.log('Crowd API verified:',d.stores.map(x=>x.chain+': '+x.label).join(' | '));"
          echo "worker_url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Configure app with Worker URL
        if: steps.credentials.outputs.ready == 'true' && steps.verify.outcome == 'success'
        env:
          CROWD_API_URL: ${{ steps.verify.outputs.worker_url }}
        run: node scripts/set-crowd-api-url.mjs "$CROWD_API_URL"

      - name: Commit Worker URL to app
        if: steps.credentials.outputs.ready == 'true' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- app/features.js; then
            echo "Crowd API URL is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/features.js
          git commit -m "Connect live crowd API"
          git push
