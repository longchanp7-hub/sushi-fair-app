name: Update sushi fairs

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/update-fairs.yml'
  schedule:
    # 06:17 JST every day (21:17 UTC on previous day)
    - cron: '17 21 * * *'

permissions:
  contents: write

concurrency:
  group: sushi-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - name: Use Toyohashi Shinsakae stores
        run: node scripts/configure-shinsakae-stores.mjs
      - run: npm run update
      - run: node scripts/apply-store-overrides.mjs
      - name: Refresh Kura data when available
        run: node scripts/fix-kura.mjs || echo "Kura refresh failed; keeping main scraper/fallback data"
      - name: Refresh crowd fallback snapshot
        run: node scripts/update-crowd.mjs || echo "Crowd snapshot refresh failed; keeping previous crowd data"
      - name: Refine crowd semantics and probe public waits
        run: node scripts/refine-crowd.mjs || echo "Crowd refinement failed; keeping generated crowd data"

      - name: Commit updated data when changed
        run: |
          if git diff --quiet -- app/data/fairs.json app/data/crowd.json; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/data/fairs.json app/data/crowd.json
            git commit -m "Update sushi app data"
            git push
          fi
