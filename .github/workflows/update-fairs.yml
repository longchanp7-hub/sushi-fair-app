name: Update sushi fairs

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/**'
      - 'app/region.js'
      - 'app/national.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update-fairs.yml'
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sushi-pages-pipeline
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies reproducibly
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci --ignore-scripts --no-audit --no-fund
          fi
      - name: Validate parsers, resolver, PWA and front-end syntax
        run: |
          node --check app/national.js
          node --check app/region.js
          node --check app/sw.js
          node --check scripts/update-fairs.mjs
          node --check scripts/fix-official-fair-discovery.mjs
          node --check scripts/resolve-representative-images.mjs
          node --check scripts/source-registry.mjs
          node --check scripts/quality-gate.mjs
          node --check scripts/normalize-campaigns.mjs
          node scripts/fix-kura.mjs --self-test
          node scripts/build-national-fairs.mjs --self-test
          node scripts/fix-national-releases.mjs --self-test
          node scripts/clean-national-products.mjs --self-test
          node scripts/resolve-representative-images.mjs --self-test
          node scripts/apply-sushiro-grace.mjs --self-test
          node scripts/fix-official-fair-discovery.mjs --self-test
          node scripts/update-local-store-contexts.mjs --self-test
          node scripts/update-local-tokai.mjs --self-test
          node scripts/fix-local-official-releases.mjs --self-test
          node scripts/normalize-campaigns.mjs --self-test
          node scripts/quality-gate.mjs --self-test
      - name: Preserve previous published fair snapshot
        run: cp app/data/fairs.json /tmp/previous-fairs.json
      - name: Ensure verified regional guard rows
        run: node scripts/ensure-region-contexts.mjs
      - name: Refresh local Tokai store catalogs independently
        run: node scripts/update-local-store-contexts.mjs
      - name: Verify Toyohashi to Sapporo regional switching
        run: node scripts/verify-region-switch.mjs
      - name: Use stable reference stores for legacy parsers
        run: node scripts/configure-shinsakae-stores.mjs
      - name: Refresh base fair scrapers
        run: npm run update
      - run: node scripts/apply-store-overrides.mjs
      - name: Refresh Kura official fair data when available
        run: node scripts/fix-kura.mjs || echo "Kura supplemental parser failed; nationwide layer will keep fail-closed data"
      - name: Clean legacy fair quality flags
        run: node scripts/clean-fair-data.mjs
      - name: Build nationwide five-chain fair data
        env:
          PREVIOUS_FAIRS: /tmp/previous-fairs.json
        run: node scripts/build-national-fairs.mjs
      - name: Resolve current Kappa and Uobei official releases
        run: node scripts/fix-national-releases.mjs
      - name: Clean final nationwide product output
        run: node scripts/clean-national-products.mjs
      - name: Apply Sushiro national source-of-truth and missing grace
        env:
          PREVIOUS_FAIRS: /tmp/previous-fairs.json
        run: node scripts/apply-sushiro-grace.mjs
      - name: Resolve Sushiro campaign identity and Kura announced fair
        run: node scripts/fix-official-fair-discovery.mjs
      - name: Add local Tokai fair data only
        run: node scripts/update-local-tokai.mjs
      - name: Apply verified current local official releases
        run: node scripts/fix-local-official-releases.mjs
      - name: Normalize concurrent campaign phases
        run: node scripts/normalize-campaigns.mjs
      - name: Resolve final food/fair representative images
        run: node scripts/resolve-representative-images.mjs
      - name: Stage candidate and promote only quality-gated data
        run: |
          cp app/data/fairs.json /tmp/fairs-candidate.json
          cp /tmp/previous-fairs.json app/data/fairs.json
          node scripts/quality-gate.mjs \
            --candidate /tmp/fairs-candidate.json \
            --previous /tmp/previous-fairs.json \
            --out app/data/fairs.json \
            --report /tmp/quality-gate.json
      - name: Validate eight-chain public dataset and regional data
        run: |
          node scripts/verify-region-switch.mjs
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('./app/data/fairs.json','utf8')); const ids=d.chains.map(x=>x.chain).sort(); const need=['hamazushi','kappasushi','kurasushi','musashimaru','sushiro','tokubei','totomaru','uobei'].sort(); if(JSON.stringify(ids)!==JSON.stringify(need)) throw new Error('Expected 8 chains: '+ids.join(',')); if(!d.qualityGate) throw new Error('Quality gate metadata missing'); for(const c of d.chains) if(!c.qualityState) throw new Error('Quality state missing for '+c.chain); const s=d.chains.find(x=>x.chain==='sushiro'); if(!s?.nationalSourceOfTruth||!s?.referenceStoreOverlayOnly) throw new Error('Sushiro source-of-truth flags missing'); for(const i of s.items) if(!('startDate' in i)||!('endDate' in i)||!i.scrapeStatus) throw new Error('Sushiro item metadata missing: '+i.name); if(s.items.length && s.fairName==='フェア商品') throw new Error('Sushiro official campaign identity was not resolved'); if(s.items.length && !s.officialCampaignUrl) throw new Error('Sushiro official campaign URL missing'); const m=d.chains.find(x=>x.chain==='musashimaru'); if(m?.items?.length) throw new Error('Musashimaru must remain fail-closed until verified products are available'); const bad=/(?:shared\/img\/ogp\.png|\/img\/ogp\/|ogp[-_.]|\/img\/mark\d+\.webp|\/themes\/[^/]+\/img\/info\/(?:sp\/)?mainimg\.(?:jpe?g|png|webp)|\/recruit\/|\/staff\/|\/company\/)/i; for(const c of d.chains){const hero=c.representativeImageUrl||c.imageUrl||''; if(hero&&bad.test(hero)) throw new Error('Generic/store hero image leaked for '+c.chain+': '+hero);}"
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('./app/data/store-contexts.json','utf8')); for(const id of ['totomaru','musashimaru','tokubei']) if(!d.catalog?.[id]) throw new Error(id+' local store catalog missing'); const f=JSON.parse(fs.readFileSync('./app/data/store-contexts-fallback.json','utf8')); for(const id of ['totomaru','musashimaru','tokubei']) if(!f.catalog?.[id]) throw new Error(id+' fallback local store catalog missing'); if(!f.catalog.totomaru['愛知県/豊橋市']) throw new Error('Totomaru Toyohashi fallback missing'); if(!f.catalog.musashimaru['愛知県/豊橋市']) throw new Error('Musashimaru Toyohashi fallback missing');"
      - name: Upload quality-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: /tmp/quality-gate.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit updated public data and generated lockfile when changed
        run: |
          if [[ -z "$(git status --porcelain -- app/data/fairs.json app/data/store-contexts.json app/data/store-contexts-fallback.json package-lock.json)" ]]; then
            echo "No public fair/store/lock changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/data/fairs.json app/data/store-contexts.json app/data/store-contexts-fallback.json
            [[ -f package-lock.json ]] && git add package-lock.json
            git commit -m "Update quality-gated sushi fair and regional data"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './app'
      - name: Deploy refreshed nationwide app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published nationwide app
        run: node scripts/verify-pages.mjs "${{ steps.deployment.outputs.page_url }}"
