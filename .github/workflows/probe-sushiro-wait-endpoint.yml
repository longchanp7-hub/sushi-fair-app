name: Probe Sushiro wait endpoint

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/probe-sushiro-wait-endpoint.mjs'
      - '.github/workflows/probe-sushiro-wait-endpoint.yml'

permissions:
  contents: write

concurrency:
  group: sushiro-wait-endpoint-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect public Sushiro endpoints
        run: node scripts/probe-sushiro-wait-endpoint.mjs
      - name: Save diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/sushiro-wait-endpoint.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/sushiro-wait-endpoint.json
          git commit -m "Add Sushiro wait endpoint diagnostic report"
          git push origin HEAD:main
