name: Clean up temporary crowd probes

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/cleanup-temporary-crowd-probes.yml'

permissions:
  contents: write

concurrency:
  group: cleanup-temporary-crowd-probes
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-time diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            scripts/probe-crowd-browser.mjs \
            .github/workflows/probe-crowd-browser.yml \
            diagnostics/crowd-browser.json \
            scripts/probe-crowd-sources.mjs \
            .github/workflows/probe-crowd-sources.yml \
            diagnostics/crowd-sources.json \
            scripts/probe-sushiro-assets.mjs \
            .github/workflows/probe-sushiro-assets.yml \
            diagnostics/sushiro-assets.json \
            scripts/probe-sushiro-wait-endpoint.mjs \
            .github/workflows/probe-sushiro-wait-endpoint.yml \
            diagnostics/sushiro-wait-endpoint.json \
            scripts/probe-sushiro-inline-api.mjs \
            .github/workflows/probe-sushiro-inline-api.yml \
            diagnostics/sushiro-inline-api.json \
            scripts/probe-sushiro-hidden-wait.mjs \
            .github/workflows/probe-sushiro-hidden-wait.yml \
            diagnostics/sushiro-hidden-wait.json \
            .github/workflows/cleanup-temporary-crowd-probes.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "Remove temporary crowd diagnostics"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
